name: Q Stone Park v3.3 analyst evidence audit
on:
  push:
    branches:
      - v3-3-industry-relative-model
    paths:
      - '.github/workflows/v3-3-analyst-evidence.yml'
permissions:
  contents: read
  actions: read
jobs:
  analyst-evidence:
    if: github.repository == 'qstonepark76/qstone-stock-analyzer'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -m unittest discover -s tests -p 'test_analyst_consensus.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-preflight
          run-id: 45625150031
          github-token: ${{ github.token }}
          path: replay-source
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-xbrl-evidence
          run-id: 45631525273
          github-token: ${{ github.token }}
          path: audit-top300-xbrl
      - run: python -u scripts/replay_v33_top300.py
      - run: python -u scripts/audit_v33_eight_factor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-analyst-evidence-results
          path: audit-top300-eight-factor/
          if-no-files-found: warn
          retention-days: 14
