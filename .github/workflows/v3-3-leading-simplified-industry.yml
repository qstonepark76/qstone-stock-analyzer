name: Q Stone Park simplified industry and financial gap audit
on:
  push:
    branches: [v3-3-final-leading-score]
    paths: ['.github/workflows/v3-3-leading-simplified-industry.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p test_leading_simplified_industry.py -v
      - uses: actions/download-artifact@v4
        with:
          name: leading-stage5-margin-evidence
          run-id: 46034168630
          github-token: ${{ github.token }}
          path: stage5
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-preflight
          run-id: 45625150031
          github-token: ${{ github.token }}
          path: replay-source
      - uses: actions/download-artifact@v4
        with:
          name: v33-merged-peer-evidence
          run-id: 45726349207
          github-token: ${{ github.token }}
          path: reuse-peers
      - run: python -u scripts/leading_simplified_industry.py
      - uses: actions/upload-artifact@v4
        with:
          name: leading-simplified-industry-evidence
          path: audit-leading-simplified/
          retention-days: 30
