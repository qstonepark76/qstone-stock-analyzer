name: Q Stone Park specialist direct ratio replay
on:
  push:
    branches: [v3-3-final-leading-score]
    paths: ['.github/workflows/v3-3-leading-specialist-direct-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_final_leading_model.py -v
      - uses: actions/download-artifact@v4
        with:
          name: leading-true-cagr-evidence
          run-id: 46049896295
          github-token: ${{ github.token }}
          path: cagr
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-preflight
          run-id: 45625150031
          github-token: ${{ github.token }}
          path: replay-source
      - run: python -u scripts/leading_specialist_direct_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: leading-specialist-direct-replay-evidence
          path: audit-leading-specialist-direct/
          retention-days: 30
