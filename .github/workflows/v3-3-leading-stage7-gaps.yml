name: Q Stone Park stage 7 targeted factor gaps and KRX index evidence
on:
  push:
    branches: [v3-3-final-leading-score]
    paths: ['.github/workflows/v3-3-leading-stage7-gaps.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: leading-stage5-margin-evidence
          run-id: 46034168630
          github-token: ${{ github.token }}
          path: stage5
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-preflight
          run-id: 45625150031
          github-token: ${{ github.token }}
          path: replay-source
      - run: python -u scripts/leading_stage7_gaps.py
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leading-stage7-gap-evidence
          path: audit-leading-stage7/
          if-no-files-found: warn
          retention-days: 30
