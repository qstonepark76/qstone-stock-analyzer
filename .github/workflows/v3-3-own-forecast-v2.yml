name: Q Stone Park v3.3 multi-vintage own forecast candidate
on:
  push:
    branches: [v3-3-industry-relative-model]
    paths: ['.github/workflows/v3-3-own-forecast-v2.yml']
permissions:
  contents: read
  actions: read
jobs:
  forecast-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p test_own_forecast_v2.py -v
      - run: python -m unittest discover -s tests -p test_outlook_combined_candidate.py -v
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-preflight
          run-id: 45625150031
          github-token: ${{ github.token }}
          path: replay-source
      - uses: actions/download-artifact@v4
        with:
          name: v33-financial-simplified-evidence
          run-id: 45656114003
          github-token: ${{ github.token }}
          path: financial
      - uses: actions/download-artifact@v4
        with:
          name: v33-own-outlook-evidence
          run-id: 45768846083
          github-token: ${{ github.token }}
          path: prior-own
      - uses: actions/download-artifact@v4
        with:
          name: v33-targeted-outlook-evidence
          run-id: 45768846083
          github-token: ${{ github.token }}
          path: prior-external
      - run: cp prior-external/data/analyst_reports.json data/analyst_reports.json
      - run: python -u audit_tools/own_forecast_v2_audit.py
        env:
          DART_AUTH_KEY: ${{ secrets.DART_AUTH_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-multi-vintage-own-forecast
          path: audit-own-forecast-v2/
          retention-days: 14
