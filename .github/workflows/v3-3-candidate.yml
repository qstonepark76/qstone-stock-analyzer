name: Q Stone Park v3.3 candidate validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-3-industry-relative-model
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Compile candidate engine
        run: python -m py_compile scripts/industry_relative.py
      - name: Run candidate industry-relative tests
        run: python -m unittest discover -s tests -p 'test_industry_relative.py' -v
