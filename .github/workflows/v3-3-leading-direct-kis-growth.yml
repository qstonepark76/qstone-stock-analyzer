name: Q Stone Park direct KIS growth and financial coverage
on:
  push:
    branches: [v3-3-final-leading-score]
    paths: ['.github/workflows/v3-3-leading-direct-kis-growth.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p test_leading_direct_kis_growth.py -v
      - uses: actions/download-artifact@v4
        with:
          name: leading-simplified-industry-evidence
          run-id: 46044687022
          github-token: ${{ github.token }}
          path: simplified
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-preflight
          run-id: 45625150031
          github-token: ${{ github.token }}
          path: replay-source
      - name: Collect KIS annual published values
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -u scripts/leading_direct_kis_growth.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leading-direct-kis-growth-evidence
          path: audit-leading-kis-growth/
          if-no-files-found: warn
          retention-days: 30
