name: Q Stone Park final model and leading score tests
on:
  push:
    branches: [v3-3-final-leading-score]
  pull_request:
    branches: [v3-3-industry-relative-model]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/final_leading_model.py
      - run: python -m unittest discover -s tests -p test_final_leading_model.py -v
