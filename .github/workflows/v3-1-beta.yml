name: Q Stone Park v3.1 Beta Validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qstone-v3-1-beta
  cancel-in-progress: false

jobs:
  validate-and-collect:
    # Temporarily suspended by owner request; restore from parent commit to resume.
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v3.1 beta branch
        uses: actions/checkout@v4
        with:
          ref: v3-1-beta

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile collector
        run: python -m py_compile scripts/collect.py

      - name: Collect KRX and rotating OpenDART batch
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_AUTH_KEY: ${{ secrets.DART_AUTH_KEY }}
        run: python -u scripts/collect.py

      - name: Save beta data to v3-1-beta
        run: |
          git config user.name "QStonePark Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "v3.1 beta data update"

          git fetch origin v3-1-beta
          git pull --rebase origin v3-1-beta

          git push origin HEAD:v3-1-beta

      - name: Upload validation data
        uses: actions/upload-artifact@v4
        with:
          name: qstone-v3-1-beta-data
          path: data/
          if-no-files-found: warn
