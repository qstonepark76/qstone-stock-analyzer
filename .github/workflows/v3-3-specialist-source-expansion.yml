name: Q Stone Park v3.3 outlook and financial source expansion
on:
  push:
    branches:
      - v3-3-industry-relative-model
    paths:
      - '.github/workflows/v3-3-specialist-source-expansion.yml'
permissions:
  contents: read
  actions: read
jobs:
  guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-preflight
          run-id: 45625150031
          github-token: ${{ github.token }}
          path: replay-source
      - run: python -u audit_tools/forward_guidance_discovery.py
        env:
          DART_AUTH_KEY: ${{ secrets.DART_AUTH_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-forward-guidance-candidates
          path: audit-forward-guidance/
          if-no-files-found: warn
          retention-days: 14
  specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: v33-financial-simplified-evidence
          run-id: 45656114003
          github-token: ${{ github.token }}
          path: audit-financial-simplified
      - run: python -u audit_tools/financial_expanded_source.py
        env:
          FISIS_AUTH_KEY: ${{ secrets.FISIS_AUTH_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-financial-expanded-source
          path: audit-financial-expanded-source/
          if-no-files-found: warn
          retention-days: 14
