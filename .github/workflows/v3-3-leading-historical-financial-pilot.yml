name: Q Stone Park historical financial filing pilot
on:
  push:
    branches: [v3-3-final-leading-score]
    paths: ['.github/workflows/v3-3-leading-historical-financial-pilot.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p test_leading_historical_financial_pilot.py -v
      - uses: actions/download-artifact@v4
        with:
          name: leading-historical-backtest-readiness
          run-id: 46051777654
          github-token: ${{ github.token }}
          path: history
      - env:
          DART_AUTH_KEY: ${{ secrets.DART_AUTH_KEY }}
        run: python -u scripts/leading_historical_financial_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: leading-historical-financial-pilot-evidence
          path: audit-leading-historical-financial/
          retention-days: 30
