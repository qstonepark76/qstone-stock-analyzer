name: Q Stone Park stage 5 recover valuation peers and margin history
on:
  push:
    branches: [v3-3-final-leading-score]
    paths: ['.github/workflows/v3-3-leading-stage5-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [offline, margin]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p test_final_leading_model.py -v
      - uses: actions/download-artifact@v4
        with:
          name: leading-stage4-forecast-evidence
          run-id: 46033410284
          github-token: ${{ github.token }}
          path: audit-leading-stage4
      - uses: actions/download-artifact@v4
        with:
          name: leading-market-inputs
          run-id: 46031114626
          github-token: ${{ github.token }}
          path: audit-leading-market
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-preflight
          run-id: 45625150031
          github-token: ${{ github.token }}
          path: replay-source
      - uses: actions/download-artifact@v4
        with:
          name: v33-merged-peer-evidence
          run-id: 45726349207
          github-token: ${{ github.token }}
          path: reuse-peers
      - if: matrix.mode == 'offline'
        run: python -u scripts/leading_stage5_recovery.py
      - if: matrix.mode == 'margin'
        env:
          DART_AUTH_KEY: ${{ secrets.DART_AUTH_KEY }}
        run: python -u scripts/leading_stage5_recovery.py --recover-margin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leading-stage5-${{ matrix.mode }}-evidence
          path: audit-leading-stage5/
          if-no-files-found: warn
          retention-days: 30
