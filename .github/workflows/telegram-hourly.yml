name: Q Stone Park Telegram Hourly Collection

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qstone-telegram-hourly
  cancel-in-progress: false

jobs:
  collect-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check Telegram credentials
        id: credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ] && [ -n "$TELEGRAM_SESSION" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Telegram secrets are not configured yet; collection skipped."
          fi

      - name: Checkout v3.2 beta
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: v3-2-beta

      - name: Set up Python
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Collect approved public channels
        if: steps.credentials.outputs.ready == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNELS: "bumgore,globalmktinsight,HanaResearch"
        run: python -u scripts/telegram_collector.py

      - name: Analyze messages in shadow mode
        if: steps.credentials.outputs.ready == 'true'
        run: python -u scripts/telegram_analyzer.py

      - name: Save Telegram data
        if: steps.credentials.outputs.ready == 'true'
        run: |
          git config user.name "QStonePark Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/telegram_*.json
          git diff --cached --quiet || git commit -m "Collect Telegram research updates"
          git fetch origin v3-2-beta
          git pull --rebase origin v3-2-beta
          git push origin HEAD:v3-2-beta
