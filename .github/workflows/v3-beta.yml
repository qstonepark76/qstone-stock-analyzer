name: Q Stone Park v3.0 Beta Validation

on:
  workflow_dispatch:
  push:
    branches:
      - v3-beta

permissions:
  contents: write

concurrency:
  group: qstone-v3-beta
  cancel-in-progress: false

jobs:
  validate-and-collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v3-beta branch
        uses: actions/checkout@v4
        with:
          ref: v3-beta

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect KRX and cached OpenDART data
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_AUTH_KEY: ${{ secrets.DART_AUTH_KEY }}
        run: python -u scripts/collect.py

      - name: Save beta data to v3-beta
        run: |
          git config user.name "QStonePark Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Beta data update"
          git push origin HEAD:v3-beta

      - name: Upload validation data
        uses: actions/upload-artifact@v4
        with:
          name: qstone-v3-beta-data
          path: data/
          if-no-files-found: warn
