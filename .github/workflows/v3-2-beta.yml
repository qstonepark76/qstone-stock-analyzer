name: Q Stone Park v3.2 Beta Validation

on:
  schedule:
    - cron: '15 10 * * 1-5' # 평일 19:15 KST
  workflow_dispatch:
  push:
    branches:
      - v3-2-beta

permissions:
  contents: write

concurrency:
  group: qstone-v3-2-beta
  cancel-in-progress: true

jobs:
  validate-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout v3.2 beta branch
        uses: actions/checkout@v4
        with:
          ref: v3-2-beta

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile collector and consensus module
        run: python -m py_compile scripts/collect.py scripts/analyst_consensus.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Discover public brokerage report candidates
        run: python -u scripts/discover_broker_reports.py

      - name: Verify and promote explicit brokerage report fields
        run: python -u scripts/verify_broker_reports.py

      - name: Collect KRX, OpenDART, KIS and verified analyst consensus
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_AUTH_KEY: ${{ secrets.DART_AUTH_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BATCH_SIZE: "100"
          DART_BATCH_SIZE: "100"
        run: python -u scripts/collect.py

      - name: Save beta data to v3-2-beta
        run: |
          git config user.name "QStonePark Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "v3.2 beta data update"

          git fetch origin v3-2-beta
          git pull --rebase origin v3-2-beta

          git push origin HEAD:v3-2-beta

      - name: Upload validation data
        uses: actions/upload-artifact@v4
        with:
          name: qstone-v3-2-beta-data
          path: data/
          if-no-files-found: warn
