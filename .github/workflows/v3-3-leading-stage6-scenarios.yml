name: Q Stone Park stage 6 separate own forecast evidence scenario
on:
  push:
    branches: [v3-3-final-leading-score]
    paths: ['.github/workflows/v3-3-leading-stage6-scenarios.yml']
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p test_leading_stage6_scenarios.py -v
      - uses: actions/download-artifact@v4
        with:
          name: leading-stage5-offline-evidence
          run-id: 46034168630
          github-token: ${{ github.token }}
          path: stage5
      - uses: actions/download-artifact@v4
        with:
          name: v33-top300-preflight
          run-id: 45625150031
          github-token: ${{ github.token }}
          path: replay-source
      - uses: actions/download-artifact@v4
        with:
          name: v33-forecast-recovery-merged
          run-id: 45817314640
          github-token: ${{ github.token }}
          path: reuse-forecast
      - uses: actions/download-artifact@v4
        with:
          name: v33-outlook-expanded-evidence
          run-id: 45726434788
          github-token: ${{ github.token }}
          path: reuse-external
      - uses: actions/download-artifact@v4
        with:
          name: v33-targeted-outlook-evidence
          run-id: 45768846083
          github-token: ${{ github.token }}
          path: reuse-targeted
      - run: python -u scripts/leading_stage6_scenarios.py
      - uses: actions/upload-artifact@v4
        with:
          name: leading-stage6-scenario-evidence
          path: audit-leading-stage6/
          retention-days: 30
